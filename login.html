<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Iniciar Sesión | Sistema Electoral Podemos Perú</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=4">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000000;
            color: #f5f5f7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; height: 600px;
            background: radial-gradient(ellipse 70% 50% at 50% -10%, rgba(0, 113, 227, 0.22) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
        }

        .login-card {
            background: rgba(18, 20, 26, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 26px;
            padding: 2.4rem 2rem;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.8), 0 0 35px rgba(0, 113, 227, 0.2);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            text-align: center;
        }

        .logo-wrapper {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(27, 75, 138, 0.6), rgba(10, 40, 90, 0.8));
            border: 1px solid rgba(59, 130, 246, 0.6);
            border-radius: 20px;
            padding: 8px;
            margin-bottom: 1.25rem;
            box-shadow: 0 0 24px rgba(27, 75, 138, 0.5), inset 0 0.5px 0 rgba(255, 255, 255, 0.2);
        }
        .logo-img {
            width: 54px; height: 54px;
            border-radius: 12px;
            object-fit: cover;
            background: #fff;
            padding: 2px;
        }

        .login-title {
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: -0.02em;
            color: #ffffff;
            margin-bottom: 0.25rem;
        }
        .login-sub {
            font-size: 0.82rem;
            color: #93c5fd;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 1.75rem;
        }

        .form-group {
            text-align: left;
            margin-bottom: 1.25rem;
        }
        .form-label {
            display: block;
            font-size: 0.76rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #86868b;
            margin-bottom: 0.45rem;
        }
        .form-input {
            width: 100%;
            padding: 0.78rem 1rem;
            background: rgba(255, 255, 255, 0.04);
            border: 0.5px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            color: #ffffff;
            font-size: 0.92rem;
            font-family: inherit;
            outline: none;
            transition: all 0.22s ease;
        }
        .form-input:focus {
            border-color: #0071e3;
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 14px rgba(0, 113, 227, 0.35);
        }

        .btn-login {
            width: 100%;
            margin-top: 0.75rem;
            padding: 0.85rem;
            background: linear-gradient(135deg, #0071e3, #1B4B8A);
            border: 1px solid rgba(96, 165, 250, 0.4);
            border-radius: 16px;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 113, 227, 0.4);
            transition: all 0.22s ease;
        }
        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 28px rgba(0, 113, 227, 0.6);
            border-color: rgba(96, 165, 250, 0.8);
        }
        .btn-login:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .login-error {
            display: none;
            background: rgba(255, 69, 58, 0.14);
            border: 0.5px solid rgba(255, 69, 58, 0.4);
            color: #ff453a;
            padding: 0.65rem 1rem;
            border-radius: 12px;
            font-size: 0.82rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            text-align: left;
        }

        /* Demo roles fast pills */
        .roles-info {
            margin-top: 1.75rem;
            padding-top: 1.25rem;
            border-top: 0.5px solid rgba(255, 255, 255, 0.08);
            text-align: left;
        }
        .roles-info-title {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #64748b;
            margin-bottom: 0.6rem;
        }
        .demo-roles {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
        .demo-role-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 0.5px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 0.45rem 0.75rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #86868b;
            font-size: 0.78rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        .demo-role-btn:hover {
            background: rgba(255, 255, 255, 0.07);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.15);
        }
        .demo-role-name { font-weight: 700; color: #f5f5f7; }
        .demo-role-desc { font-size: 0.7rem; color: #64748b; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo-wrapper">
                <img src="img/podemos_peru_logo.jpg" alt="Podemos Perú" class="logo-img">
            </div>

            <h1 class="login-title">Sistema Electoral</h1>
            <p class="login-sub">PODEMOS PERÚ · ODPE PASCO</p>

            <div id="loginError" class="login-error">
                <span>⚠️ Usuario o contraseña incorrectos.</span>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="username">Usuario</label>
                    <input type="text" id="username" class="form-input" required placeholder="Ej: admin o digitador1" autocomplete="username">
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Contraseña</label>
                    <input type="password" id="password" class="form-input" required placeholder="••••••••" autocomplete="current-password">
                </div>

                <button type="submit" class="btn-login" id="btnLogin">Ingresar al Sistema</button>
            </form>

            <div class="roles-info">
                <p class="roles-info-title">Accesos Rápidos por Rol:</p>
                <div class="demo-roles">
                    <button type="button" class="demo-role-btn" onclick="fillCredentials('admin', 'admin123')">
                        <span>🛡️ <span class="demo-role-name">admin</span></span>
                        <span class="demo-role-desc">Acceso Total</span>
                    </button>
                    <button type="button" class="demo-role-btn" onclick="fillCredentials('digitador1', 'digitador123')">
                        <span>✍️ <span class="demo-role-name">digitador1</span></span>
                        <span class="demo-role-desc">Solo Digitación</span>
                    </button>
                    <button type="button" class="demo-role-btn" onclick="fillCredentials('invitado', 'invitado123')">
                        <span>📊 <span class="demo-role-name">invitado</span></span>
                        <span class="demo-role-desc">Solo Estadísticas</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function fillCredentials(user, pass) {
            document.getElementById('username').value = user;
            document.getElementById('password').value = pass;
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnLogin');
            const err = document.getElementById('loginError');

            btn.disabled = true;
            btn.textContent = "Autenticando...";
            err.style.display = 'none';

            try {
                const res = await fetch('api/login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value.trim(),
                        password: document.getElementById('password').value
                    })
                });

                const data = await res.json();
                if (data.success) {
                    window.location.href = data.redirect || 'dashboard.html';
                } else {
                    err.style.display = 'block';
                    err.querySelector('span').textContent = '⚠️ ' + (data.message || 'Error de credenciales.');
                }
            } catch (error) {
                err.style.display = 'block';
                err.querySelector('span').textContent = '⚠️ Error de comunicación con el servidor.';
            } finally {
                btn.disabled = false;
                btn.textContent = "Ingresar al Sistema";
            }
        });
    </script>
</body>
</html>
