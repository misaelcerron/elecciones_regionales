<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Sistema Electoral</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100%;
        }
        .login-card {
            max-width: 400px;
            text-align: center;
        }
        .login-card h2 {
            margin-bottom: 2rem;
            font-size: 1.8rem;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="container login-card">
            <div class="header">
                <h2>Acceso Restringido</h2>
                <p>Ingrese sus credenciales de operador</p>
            </div>
            
            <form id="loginForm">
                <div class="form-group" style="text-align: left; margin-bottom: 1.5rem;">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" required placeholder="Ej: admin">
                </div>
                <div class="form-group" style="text-align: left; margin-bottom: 1.5rem;">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                
                <div id="loginError" class="validation-banner error" style="display: none; padding: 0.5rem; margin-top:0; margin-bottom: 1rem;">
                    <span class="status">Error de credenciales</span>
                </div>

                <button type="submit" class="btn-submit" id="btnLogin">Ingresar al Sistema</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnLogin');
            const err = document.getElementById('loginError');
            
            btn.disabled = true;
            btn.textContent = "Autenticando...";
            err.style.display = 'none';

            try {
                const res = await fetch('api/login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });
                
                const data = await res.json();
                if (data.success) {
                    window.location.href = data.redirect;
                } else {
                    err.style.display = 'block';
                    err.querySelector('.status').textContent = data.message;
                }
            } catch (error) {
                err.style.display = 'block';
                err.querySelector('.status').textContent = "Error de conexión al servidor.";
            } finally {
                btn.disabled = false;
                btn.textContent = "Ingresar al Sistema";
            }
        });
    </script>
</body>
</html>
