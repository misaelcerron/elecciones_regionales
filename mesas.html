<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantenimiento de Mesas | Sistema Electoral</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1rem 2rem; background: var(--glass-bg);
            backdrop-filter: blur(10px); border-bottom: 1px solid var(--glass-border);
            position: fixed; top: 0; width: 100%; z-index: 100;
        }
        .navbar a { color: white; text-decoration: none; margin-right: 1.5rem; font-weight: 600; transition: color 0.3s; }
        .navbar a:hover { color: var(--primary-color); }
        .navbar-user { display: flex; align-items: center; gap: 1rem; }
        .btn-logout { background: transparent; border: 1px solid var(--error-color); color: var(--error-color); padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; transition: all 0.3s; }
        
        .container { margin-top: 100px; max-width: 1100px; display: grid; grid-template-columns: 1fr 2fr; gap: 2rem; }
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
        
        .form-panel { background: rgba(0,0,0,0.2); padding: 1.5rem; border-radius: 12px; border: 1px solid var(--glass-border); height: fit-content; }
        .table-panel { background: rgba(0,0,0,0.2); padding: 1.5rem; border-radius: 12px; border: 1px solid var(--glass-border); overflow-x: auto; }
        
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 1rem; border-bottom: 1px solid var(--glass-border); }
        th { color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; }
        tr:hover td { background: rgba(255,255,255,0.05); cursor: pointer; }
        
        .btn-clear { background: rgba(255,255,255,0.1); margin-top: 1rem; border: 1px solid var(--glass-border); color: white; padding: 0.75rem; border-radius: 8px; width: 100%; cursor: pointer; transition: 0.3s; }
        .btn-clear:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-links">
            <span style="font-weight: 800; font-size: 1.2rem; margin-right: 2rem; color: #a78bfa;">ODPE PASCO</span>
            <a href="dashboard.html">Dashboard</a>
            <a href="reportes.html">Reportes</a>
            <a href="mesas.html" style="color: var(--primary-color);">Gestión Mesas</a>
            <a href="index.html">Digitación</a>
        </div>
        <div class="navbar-user">
            <span id="navUsername">Usuario</span>
            <button class="btn-logout" id="btnLogout">Salir</button>
        </div>
    </nav>

    <div class="container">
        <!-- Formulario CRUD -->
        <div class="form-panel">
            <h2 class="section-title">Registrar / Editar Mesa</h2>
            <form id="mesaForm">
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label>Número de Mesa</label>
                    <input type="text" id="id_mesa" required placeholder="Ej: 068426" maxlength="10">
                    <small style="color:var(--text-muted); margin-top: 5px;">*Si la mesa existe, actualizará los datos.</small>
                </div>
                <div class="form-group">
                    <label>Electores Hábiles (Padrón)</label>
                    <input type="number" id="electores_habiles" required min="1" placeholder="Ej: 300">
                </div>
                
                <button type="submit" class="btn-submit" id="btnGuardar">Guardar Mesa</button>
                <button type="button" class="btn-clear" id="btnLimpiar">Limpiar Formulario</button>
            </form>
        </div>

        <!-- Tabla Listado -->
        <div class="table-panel">
            <h2 class="section-title">Padrón de Mesas</h2>
            <table>
                <thead>
                    <tr>
                        <th>N° Mesa</th>
                        <th>Distrito</th>
                        <th>Local</th>
                        <th>Electores</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tablaMesas">
                    <tr><td colspan="5" style="text-align:center">Cargando...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/mesas.js"></script>
</body>
</html>
