<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantenimiento de Mesas | Sistema Electoral</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1rem 2rem; background: var(--glass-bg);
            backdrop-filter: blur(10px); border-bottom: 1px solid var(--glass-border);
            position: fixed; top: 0; width: 100%; z-index: 100;
        }
        .navbar a { color: white; text-decoration: none; margin-right: 1.5rem; font-weight: 600; transition: color 0.3s; }
        .navbar a:hover { color: var(--primary-color); }
        .navbar-user { display: flex; align-items: center; gap: 1rem; }
        .btn-logout { background: transparent; border: 1px solid var(--error-color); color: var(--error-color); padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; transition: all 0.3s; }
        .btn-logout:hover { background: var(--error-color); color: white; }

        .page-wrapper { margin-top: 90px; max-width: 1200px; margin-left: auto; margin-right: auto; padding: 1rem 1.5rem; }

        /* ── Barra compacta de importación (TOP) ── */
        .import-bar {
            display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
            background: rgba(59,130,246,0.08); border: 1px solid rgba(59,130,246,0.25);
            border-radius: 10px; padding: 0.65rem 1.2rem; margin-bottom: 1.25rem;
        }
        .import-bar label { font-size: 0.85rem; font-weight: 600; color: #94a3b8; white-space: nowrap; }
        .import-bar-file { display: flex; align-items: center; gap: 0.6rem; flex: 1; }
        .import-file-btn { background: rgba(255,255,255,0.08); border: 1px dashed rgba(255,255,255,0.25); color: #94a3b8; padding: 0.4rem 0.9rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; transition: 0.2s; white-space: nowrap; }
        .import-file-btn:hover { background: rgba(255,255,255,0.15); color: white; }
        .import-file-name { font-size: 0.8rem; color: #60a5fa; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px; }
        .btn-upload { background: rgba(59,130,246,0.8); border: none; color: white; padding: 0.4rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: 0.2s; white-space: nowrap; }
        .btn-upload:hover { background: #3b82f6; }
        .btn-upload:disabled { background: #374151; color: #6b7280; cursor: not-allowed; }
        .btn-template-sm { background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.4); color: #34d399; padding: 0.4rem 0.9rem; border-radius: 6px; cursor: pointer; font-size: 0.82rem; font-weight: 600; transition: 0.2s; white-space: nowrap; }
        .btn-template-sm:hover { background: rgba(16,185,129,0.3); }
        .import-feedback { font-size: 0.8rem; padding: 0.35rem 0.75rem; border-radius: 6px; display: none; }
        .import-feedback.ok { background: rgba(16,185,129,0.15); color: #34d399; border: 1px solid #10b981; }
        .import-feedback.err { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid #ef4444; }

        /* ── Grid principal ── */
        .main-grid { display: grid; grid-template-columns: 280px 1fr; gap: 1.25rem; align-items: start; }
        @media (max-width: 860px) { .main-grid { grid-template-columns: 1fr; } }

        .form-panel { background: rgba(0,0,0,0.25); padding: 1.4rem; border-radius: 14px; border: 1px solid var(--glass-border); position: sticky; top: 100px; }
        .table-panel { background: rgba(0,0,0,0.25); padding: 1.4rem; border-radius: 14px; border: 1px solid var(--glass-border); overflow-x: auto; min-height: 400px; }

        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th { color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; padding: 0.65rem 0.85rem; border-bottom: 1px solid var(--glass-border); }
        td { padding: 0.6rem 0.85rem; border-bottom: 1px solid rgba(255,255,255,0.04); vertical-align: middle; }
        tr:hover td { background: rgba(255,255,255,0.04); }

        .btn-accion { padding: 3px 9px; border-radius: 5px; border: none; font-size: 0.76rem; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-editar { background: rgba(59,130,246,0.2); color: #60a5fa; border: 1px solid #3b82f6; }
        .btn-editar:hover { background: #3b82f6; color: white; }
        .btn-eliminar { background: rgba(239,68,68,0.2); color: #f87171; border: 1px solid #ef4444; margin-left: 5px; }
        .btn-eliminar:hover { background: #ef4444; color: white; }

        .btn-clear { background: rgba(255,255,255,0.07); margin-top: 0.6rem; border: 1px solid var(--glass-border); color: var(--text-muted); padding: 0.6rem; border-radius: 8px; width: 100%; cursor: pointer; transition: 0.3s; }
        .btn-clear:hover { background: rgba(255,255,255,0.14); color: white; }

        .table-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.85rem; flex-wrap: wrap; gap: 0.5rem; }
        .search-input { background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); border-radius: 8px; padding: 0.45rem 0.85rem; color: white; font-size: 0.85rem; outline: none; width: 180px; }
        .search-input:focus { border-color: var(--primary-color); }
        .mesa-count { color: var(--text-muted); font-size: 0.8rem; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-links">
            <span style="font-weight: 800; font-size: 1.2rem; margin-right: 2rem; color: #a78bfa;">ODPE PASCO</span>
            <a href="dashboard.html">Dashboard</a>
            <a href="reportes.html">Reportes</a>
            <a href="mesas.html" style="color: var(--primary-color);">Gestión Mesas</a>
            <a href="index.html">Digitación</a>
        </div>
        <div class="navbar-user">
            <span id="navUsername">Usuario</span>
            <button class="btn-logout" id="btnLogout">Salir</button>
        </div>
    </nav>

    <div class="page-wrapper">

        <!-- ── Barra compacta de importación ── -->
        <div class="import-bar">
            <label>📥 Importar Excel:</label>
            <div class="import-bar-file">
                <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none">
                <button class="import-file-btn" onclick="document.getElementById('fileInput').click()">Seleccionar archivo</button>
                <span class="import-file-name" id="fileName">Ningún archivo seleccionado</span>
            </div>
            <button class="btn-upload" id="btnImportar" disabled>⬆ Importar</button>
            <button class="btn-template-sm" id="btnDescargarPlantilla">⬇ Plantilla</button>
            <div class="import-feedback" id="importFeedback"></div>
        </div>

        <!-- ── Grid: Formulario + Tabla ── -->
        <div class="main-grid">

            <!-- Formulario -->
            <div class="form-panel">
                <h2 class="section-title">Registrar / Editar Mesa</h2>
                <form id="mesaForm">
                    <div class="form-group" style="margin-bottom:0.9rem;">
                        <label>Número de Mesa</label>
                        <input type="text" id="id_mesa" required placeholder="Ej: 068426" maxlength="10">
                        <small style="color:var(--text-muted); margin-top:3px; display:block; font-size:0.78rem;">*Si existe, actualizará los datos.</small>
                    </div>
                    <div class="form-group">
                        <label>Electores Hábiles (Padrón)</label>
                        <input type="number" id="electores_habiles" required min="0" placeholder="Ej: 300">
                    </div>
                    <button type="submit" class="btn-submit" id="btnGuardar" style="margin-top:0.9rem;">Guardar Mesa</button>
                    <button type="button" class="btn-clear" id="btnLimpiar">Limpiar Formulario</button>
                </form>
            </div>

            <!-- Tabla Padrón -->
            <div class="table-panel">
                <div class="table-header">
                    <h2 class="section-title" style="margin-bottom:0;">Padrón de Mesas</h2>
                    <div style="display:flex; gap:0.6rem; align-items:center;">
                        <span class="mesa-count" id="mesaCount"></span>
                        <input type="text" id="searchInput" class="search-input" placeholder="Buscar mesa/distrito...">
                        <button id="btnEliminarTodas" style="background:rgba(239,68,68,0.2); border:1px solid #ef4444; color:#f87171; padding:0.4rem 0.85rem; border-radius:7px; cursor:pointer; font-size:0.8rem; font-weight:700; transition:0.2s; white-space:nowrap;" title="Eliminar todas las mesas del padrón">
                            🗑 Eliminar Todo
                        </button>
                    </div>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>N° Mesa</th>
                            <th>Distrito</th>
                            <th>Local / Centro Poblado</th>
                            <th>Electores</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaMesas">
                        <tr><td colspan="5" style="text-align:center; padding:2rem; color:var(--text-muted);">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/mesas.js"></script>
</body>
</html>
