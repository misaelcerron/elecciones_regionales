<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes | Sistema Electoral</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1rem 2rem; background: var(--glass-bg);
            backdrop-filter: blur(10px); border-bottom: 1px solid var(--glass-border);
            position: fixed; top: 0; width: 100%; z-index: 100;
        }
        .navbar a { color: white; text-decoration: none; margin-right: 1.5rem; font-weight: 600; transition: color 0.3s; }
        .navbar a:hover { color: var(--primary-color); }
        .navbar-user { display: flex; align-items: center; gap: 1rem; }
        .btn-logout { background: transparent; border: 1px solid var(--error-color); color: var(--error-color); padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; transition: all 0.3s; }
        .btn-logout:hover { background: var(--error-color); color: white; }
        
        .container { margin-top: 100px; max-width: 1100px; }

        .tabs { display: flex; gap: 1rem; margin-bottom: 2rem; border-bottom: 1px solid var(--glass-border); padding-bottom: 1rem; }
        .tab-btn { background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border); color: white; padding: 0.75rem 1.5rem; border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.3s; }
        .tab-btn.active { background: var(--primary-color); border-color: var(--primary-glow); box-shadow: 0 4px 15px var(--primary-glow); }
        
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { text-align: left; padding: 1rem; border-bottom: 1px solid var(--glass-border); }
        th { background: rgba(255,255,255,0.05); color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; }
        tr:hover td { background: rgba(255,255,255,0.03); }

        .badge { padding: 0.25rem 0.75rem; border-radius: 99px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
        .badge.contabilizada { background: rgba(16,185,129,0.2); color: #34d399; border: 1px solid #10b981; }
        .badge.observada { background: rgba(239,68,68,0.2); color: #f87171; border: 1px solid #ef4444; }
        .badge.digitada { background: rgba(59,130,246,0.2); color: #60a5fa; border: 1px solid #3b82f6; }
        .badge.falta { background: rgba(148,163,184,0.2); color: #94a3b8; border: 1px solid #64748b; }
        
        .progress-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; margin-top: 0.5rem; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #8b5cf6); border-radius: 4px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-links">
            <span style="font-weight: 800; font-size: 1.2rem; margin-right: 2rem; color: #a78bfa;">ODPE PASCO</span>
            <a href="dashboard.html">Dashboard</a>
            <a href="reportes.html" style="color: var(--primary-color);">Reportes</a>
            <a href="index.html">Digitación de Actas</a>
        </div>
        <div class="navbar-user">
            <span id="navUsername">Usuario</span>
            <button class="btn-logout" id="btnLogout">Salir</button>
        </div>
    </nav>

    <div class="container">
        <div class="header" style="text-align: left; padding-bottom: 0; border: none;">
            <h1>Módulo de Reportes</h1>
            <p>Monitoreo detallado del estado del escrutinio</p>
        </div>

        <div class="tabs">
            <button class="tab-btn active" id="tabMesas">Reporte por Mesas</button>
            <button class="tab-btn" id="tabDistritos">Reporte por Distritos</button>
        </div>

        <div id="tableContainer">
            <!-- La tabla se generará aquí con JS -->
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/reportes.js"></script>
</body>
</html>
